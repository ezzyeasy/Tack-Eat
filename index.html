<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tack-Eat</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <div class="nav-brand">
        <a class="logo" href="#home" aria-label="Tack-Eat home">
          <img src="Assets/Tack-Eat_Logo-White.svg" alt="" width="164" height="21">
        </a>
        <button class="nav-button location" type="button" data-preview="location" aria-haspopup="dialog">
          <img class="icon pin-icon" src="icons/map-pin.svg" alt="" width="12" height="12">
          Seoul, KR · Now
          <span class="chevron" aria-hidden="true"></span>
        </button>
      </div>

      <div class="nav-actions">
        <button class="nav-button cart" type="button" data-preview="cart" aria-label="Cart" aria-haspopup="dialog">
          <img class="icon cart-icon" src="icons/cart.svg" alt="" width="18" height="18">
        </button>
        <button class="nav-button" type="button" data-preview="explore" aria-haspopup="dialog">Explore</button>
        <button class="nav-button" type="button" data-preview="nearby" aria-haspopup="dialog">What's Nearby</button>
        <button class="nav-button" type="button" data-preview="offers" aria-haspopup="dialog">Offers</button>
        <button class="nav-button sign-up" type="button" data-preview="signup" aria-haspopup="dialog">Sign Up</button>
      </div>
    </nav>
  </header>

  <main id="home">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">Tack your spot.<br> Find your next bite!</h1>
        <p>
          <span>Drop a pin and discover food spots around you.</span>
          <span>Filter by what you’re craving, pick your favourite,</span>
          <span>and let your next meal come to you.</span>
        </p>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <svg class="hero-art" viewBox="0 0 2046 1200" focusable="false">
          <defs>
            <filter id="nav-icon-color" color-interpolation-filters="sRGB">
              <feFlood flood-color="#ffefcd" result="cream"/>
              <feComposite in="cream" in2="SourceAlpha" operator="in"/>
            </filter>
          </defs>
          <image href="images/burger-hero.png" x="39" y="65" width="1127" height="1922"
            transform="translate(2046 0) rotate(90)"/>
        </svg>
      </div>
    </section>
  </main>

  <dialog class="preview" aria-labelledby="preview-title" aria-describedby="preview-message">
    <h2 id="preview-title"></h2>
    <p id="preview-message"></p>
    <form method="dialog">
      <button type="submit" autofocus>Close</button>
    </form>
  </dialog>
</body>

</html>
