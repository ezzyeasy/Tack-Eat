
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tack-Eat | Contact Us</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CONTACT US SECTION -->
  <section class="contact-section" id="contact">

    <div class="contact-container">

      <!-- LEFT SIDE -->
      <div class="contact-left">

        <h1 class="contact-title">
          Let's Tack<br>
          About It!
        </h1>

        <form class="contact-form" onsubmit="return false;">

          <div class="contact-row">
            <input type="text" placeholder="NAME" aria-label="Name">
            <input type="email" placeholder="EMAIL" aria-label="Email">
          </div>

          <input type="text" placeholder="SUBJECT" aria-label="Subject">

          <textarea placeholder="MESSAGE" aria-label="Message"></textarea>

          <button type="button" class="contact-submit">
            SEND IT !
          </button>

        </form>

      </div>

      <!-- RIGHT SIDE -->
      <div class="contact-right">

        <h2>
          Pin your place.<br>
          Find your taste!
        </h2>

        <div class="contact-divider"></div>

        <p>
          Drop a message and let's<br>
          make your Tack-Eat<br>
          experience even better.
        </p>

      </div>

    </div>

  </section>

</body>
</html>
